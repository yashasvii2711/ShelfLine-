<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shelfline | Stock &amp; orders</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='16' width='52' height='32' rx='5' fill='%23ffcf33'/%3E%3Ccircle cx='18' cy='32' r='5' fill='%23101935'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand"><span class="mark"></span>Shelfline</div>
      <div class="where"><label for="storeSelect">You are at</label><select id="storeSelect"></select></div>
      <nav id="tabs" aria-label="Main">
        <button data-tab="dashboard">Shelf watch</button>
        <button data-tab="neworder">New order</button>
        <button data-tab="orders">Orders</button>
        <button data-tab="inventory">Stock</button>
        <button class="mgr" data-tab="products">Products</button>
        <button class="mgr" data-tab="stores">Stores</button>
        <button class="mgr" data-tab="team">Team</button>
      </nav>
      <div class="me"><div><b id="meName"></b><span id="meRole"></span></div><button class="ghost" data-action="logout">Sign out</button></div>
      <a class="docs" href="/api-docs" target="_blank" rel="noopener">Developer docs</a>
    </aside>
    <main id="view"><p class="muted">Loading…</p></main>
  </div>
  <div id="gate" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <dialog id="dlg"></dialog>
  <script src="/app.js"></script>
</body>
</html>
